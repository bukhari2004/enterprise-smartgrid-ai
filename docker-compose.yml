# Full stack: API + stream worker + PostgreSQL + Redis + Kafka (KRaft) + Neo4j.
# NOTE: written for Docker Compose v2; the broker/Neo4j settings follow the images' documented env vars.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: grid, POSTGRES_PASSWORD: grid, POSTGRES_DB: grid }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U grid"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 12
  neo4j:
    image: neo4j:5
    environment: { NEO4J_AUTH: neo4j/gridgraph123, NEO4J_PLUGINS: '["apoc"]' }
    ports: ["7474:7474", "7687:7687"]
  api:
    build: .
    env_file: .env.example
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://grid:grid@postgres:5432/grid
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: gridgraph123
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started }, kafka: { condition: service_started } }
  worker:                       # Kafka consumer: scale with `docker compose up --scale worker=4` (consumer group)
    build: .
    command: python -m scripts.stream_worker
    environment: { DATABASE_URL: "postgresql://grid:grid@postgres:5432/grid", KAFKA_BOOTSTRAP: "kafka:9092" }
    depends_on: [kafka, postgres]
  producer:                     # synthetic telemetry into Kafka (profile: demo)
    build: .
    command: python -m scripts.stream_producer --rate 20000
    environment: { KAFKA_BOOTSTRAP: "kafka:9092" }
    profiles: [demo]
    depends_on: [kafka]
volumes: { pgdata: {} }
